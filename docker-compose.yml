services:
  db:
    image: mariadb:10.11
    container_name: stremio-http-proxy-db
    command: --innodb-buffer-pool-size=64M --max-connections=50
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-stremio_http_proxy}
      MARIADB_USER: ${DB_USER:-proxy_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-proxy_password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-stremio_http_proxy}
      MYSQL_USER: ${DB_USER:-proxy_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-proxy_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  stremio-http-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stremio-http-proxy
    env_file:
      - .env
    ports:
      - "8691:8691"
    volumes:
      - app-var:/app/var
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  stremio-http-proxy-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "stremio_http_proxy.cli", "worker"]
    env_file:
      - .env
    volumes:
      - app-var:/app/var
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  app-var:
  mariadb_data:
