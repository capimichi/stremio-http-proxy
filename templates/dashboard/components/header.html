<header class="flex h-16 items-center justify-between border-b border-slate-800 bg-slate-900/80 backdrop-blur-md px-4 sm:px-6 shadow-sm sticky top-0 z-30">
  <div class="flex items-center gap-3">
    <button
      id="sidebar-toggle"
      type="button"
      onclick="toggleSidebar()"
      class="rounded-xl p-2 text-slate-400 hover:bg-slate-800 hover:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-colors"
      aria-label="Toggle sidebar"
      title="Toggle sidebar"
    >
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <h1 class="text-base sm:text-lg font-semibold text-white tracking-tight">{% block page_title %}{% endblock %}</h1>
  </div>

  <div class="flex items-center gap-2 sm:gap-4">
    <!-- Live Storage Indicator -->
    <div id="header-storage-pill" class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-950/70 border border-slate-800 text-xs">
      <i class="fa-solid fa-server text-slate-400"></i>
      <span class="text-slate-400">Cache:</span>
      <span id="header-cache-size" class="font-semibold text-slate-200">-</span>
    </div>

    <!-- Live Download Rate -->
    <div id="header-speed-pill" class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-950/70 border border-slate-800 text-xs">
      <i class="fa-solid fa-arrow-down text-indigo-400"></i>
      <span id="header-active-count" class="font-medium text-slate-300">0 attivi</span>
    </div>

    <!-- Quick link to add to Stremio -->
    <a
      id="header-stremio-install"
      href="#"
      class="inline-flex items-center gap-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 text-xs font-semibold text-white shadow-sm shadow-indigo-600/30 transition-all hover:scale-[1.02]"
      title="Installa Addon in Stremio"
    >
      <i class="fa-solid fa-plus text-[11px]"></i>
      <span class="hidden xs:inline">Installa in Stremio</span>
    </a>
  </div>
</header>
