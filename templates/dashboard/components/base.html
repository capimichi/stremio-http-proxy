<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stremio Hub">
  <meta name="theme-color" content="#090d16">
  <title>{% block title %}Stremio Media Hub{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      width: 100%;
      font-size: 13.5px;
      font-weight: 500;
      border-radius: 10px;
      transition: all 0.15s ease-in-out;
      line-height: 1.2;
      color: #94a3b8;
      text-decoration: none;
    }
    .sidebar-link:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #f8fafc;
      transform: translateX(2px);
    }
    .sidebar-link.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.15));
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      font-weight: 600;
    }
    .sidebar-link svg, .sidebar-link i {
      flex-shrink: 0;
      font-size: 16px;
    }

    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    #sidebar {
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), margin-left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @media (min-width: 1024px) {
      #sidebar.desktop-closed {
        margin-left: -16rem;
      }
    }
  </style>
</head>
<body class="antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
  <div class="flex h-screen overflow-hidden relative">
    <!-- Backdrop overlay for mobile sidebar -->
    <div id="sidebar-backdrop" class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm hidden transition-opacity lg:hidden" onclick="toggleSidebar()"></div>

    {% include "dashboard/components/sidebar.html" %}
    <div class="flex flex-1 flex-col overflow-hidden min-w-0">
      {% include "dashboard/components/header.html" %}
      <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const backdrop = document.getElementById("sidebar-backdrop");
      if (!sidebar) return;
      const isDesktop = window.innerWidth >= 1024;

      if (isDesktop) {
        sidebar.classList.toggle("desktop-closed");
      } else {
        const isOpen = sidebar.classList.contains("translate-x-0");
        if (isOpen) {
          sidebar.classList.remove("translate-x-0");
          sidebar.classList.add("-translate-x-full");
          if (backdrop) backdrop.classList.add("hidden");
        } else {
          sidebar.classList.remove("-translate-x-full");
          sidebar.classList.add("translate-x-0");
          if (backdrop) backdrop.classList.remove("hidden");
        }
      }
    }

    function closeMobileSidebar() {
      if (window.innerWidth < 1024) {
        const sidebar = document.getElementById("sidebar");
        const backdrop = document.getElementById("sidebar-backdrop");
        if (sidebar) {
          sidebar.classList.remove("translate-x-0");
          sidebar.classList.add("-translate-x-full");
        }
        if (backdrop) {
          backdrop.classList.add("hidden");
        }
      }
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
