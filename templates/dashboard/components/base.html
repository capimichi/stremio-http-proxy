<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stremio Proxy">
  <meta name="theme-color" content="#111827">
  <title>{% block title %}Stremio HTTP Proxy{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      width: 100%;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
      line-height: 1;
      color: #d1d5db;
      text-decoration: none;
    }
    .sidebar-link:hover { background: #374151; color: #fff; }
    .sidebar-link.active { background: #374151; color: #fff; }
    .sidebar-link svg { display: block; flex-shrink: 0; }

    #sidebar {
      transition: transform 0.25s ease-in-out, margin-left 0.25s ease-in-out;
    }
    @media (min-width: 1024px) {
      #sidebar.desktop-closed {
        margin-left: -16rem; /* w-64 is 16rem */
      }
    }
  </style>
</head>
<body class="bg-gray-100 antialiased">
  <div class="flex h-screen overflow-hidden relative">
    <!-- Backdrop overlay for mobile sidebar -->
    <div id="sidebar-backdrop" class="fixed inset-0 z-40 bg-gray-900/50 hidden transition-opacity lg:hidden" onclick="toggleSidebar()"></div>

    {% include "dashboard/components/sidebar.html" %}
    <div class="flex flex-1 flex-col overflow-hidden min-w-0">
      {% include "dashboard/components/header.html" %}
      <main class="flex-1 overflow-y-auto p-4 sm:p-6">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const backdrop = document.getElementById("sidebar-backdrop");
      if (!sidebar) return;
      const isDesktop = window.innerWidth >= 1024;

      if (isDesktop) {
        sidebar.classList.toggle("desktop-closed");
      } else {
        const isOpen = sidebar.classList.contains("translate-x-0");
        if (isOpen) {
          sidebar.classList.remove("translate-x-0");
          sidebar.classList.add("-translate-x-full");
          if (backdrop) backdrop.classList.add("hidden");
        } else {
          sidebar.classList.remove("-translate-x-full");
          sidebar.classList.add("translate-x-0");
          if (backdrop) backdrop.classList.remove("hidden");
        }
      }
    }

    function closeMobileSidebar() {
      if (window.innerWidth < 1024) {
        const sidebar = document.getElementById("sidebar");
        const backdrop = document.getElementById("sidebar-backdrop");
        if (sidebar) {
          sidebar.classList.remove("translate-x-0");
          sidebar.classList.add("-translate-x-full");
        }
        if (backdrop) {
          backdrop.classList.add("hidden");
        }
      }
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
